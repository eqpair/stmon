    <script>
        // EQ_STMON_LIVE: 실시간 데이터는 EC2(nginx)에서 바로, 실패하면 GitHub Pages 사본으로
        (function () {
            var LIVE = 'https://eqmon.duckdns.org/stmon-data/';
            var FILES = ['stock_data.json', 'pair-trades.json', 'v2_dashboard.json'];
            var orig = window.fetch.bind(window);
            window.fetch = function (input, init) {
                try {
                    var raw = typeof input === 'string' ? input : (input && input.url) || '';
                    var u = new URL(raw, location.href);
                    var m = u.origin === location.origin && u.pathname.match(/\/data\/([A-Za-z0-9_\-]+\.json)$/);
                    if (m && FILES.indexOf(m[1]) >= 0) {
                        return orig(LIVE + m[1] + u.search, { cache: 'no-store' })
                            .then(function (r) { if (!r.ok) throw new Error(r.status); return r; })
                            .catch(function () { return orig(input, init); });
                    }
                } catch (e) { }
                return orig(input, init);
            };
        })();
    </script>

            <div class="text-xs text-gray-400 mt-2">세로 = 보통주 청산가, 가로 = 우선주 청산가 (2호가 간격). 가운데가 입력한 가격.</div>

    <script>
        // KRX 호가단위 (2023~ 코스피·코스닥 공통)
        function tickOf(px) { return px < 2000 ? 1 : px < 5000 ? 5 : px < 20000 ? 10 : px < 50000 ? 50 : px < 200000 ? 100 : px < 500000 ? 500 : 1000; }
        function tickUp(px) { const t = tickOf(px); return Math.floor(px / t) * t + t; }
        function tickDown(px) { const t = tickOf(px - 1); return Math.ceil(px / t) * t - t; }
        // 위·아래 화살표(키보드·스핀 버튼)를 한 호가씩 움직이게
        function bindTick(el) {
            let prev = +el.value || 0;
            const sync = () => { prev = +el.value || 0; el.step = tickOf(prev || 1); };
            el.addEventListener('input', e => {
                const v = +el.value;
                if (!e.inputType && prev && v !== prev) el.value = v > prev ? tickUp(prev) : tickDown(prev);   // 스핀/화살표
                sync();
            });
            el.addEventListener('focus', sync); el.addEventListener('change', sync);
            sync();
        }
        const COMM = 10, TAX_SELL = 20;   // 청산: 보통주 숏 = 매수(수수료), 우선주 롱 = 매도(수수료+거래세)
        let TRADES = [], LIVEPX = {};
        const fmt = v => (v >= 0 ? '' : '-') + Math.abs(Math.round(v)).toLocaleString();
        const cls = v => v > 0 ? 'pos' : v < 0 ? 'neg' : '';
        const kstToday = () => new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10);
        const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 864e5);
        const norm = s => String(s || '').replace(/<[^>]+>/g, '').replace(/^[^\w\s가-힣]+/, '').replace(/-\d+(\.\d+)?$/, '').trim().toLowerCase();

        // Report(pair-report.html)와 같은 계산. 우리 기준: + 이익, − 손실
        function calcTrade(t, cpx, ppx, xdate, cdOverride, fs = 1, fl = 1) {   // fs·fl: 청산 수량 ÷ 보유 수량 (정산 현금도 수량 비례로 배분)
            const CUR = t.current || null;
            const c0 = CUR ? CUR.common_s0 : t.common_entry, p0 = CUR ? CUR.preferred_s0 : t.preferred_entry;
            const start = CUR ? CUR.start : t.entry_date;
            const d = CUR ? Math.max(1, daysBetween(start, xdate)) : Math.max(1, Math.floor((new Date(xdate) - new Date(t.entry_date)) / 864e5));
            const baseCd = CUR && CUR.cd != null ? CUR.cd : (t.benchmark_rate_pct || 0);
            const cd = (cdOverride != null && !isNaN(cdOverride) ? cdOverride : baseCd) / 100;
            const sS = (t.common_floating_spread_bps ?? -202) / 10000, sL = (t.preferred_floating_spread_bps ?? 200) / 10000;
            const q = t.common_qty, Q = t.preferred_qty;
            const S = {
                price: (c0 - cpx) * q,
                cost: -cpx * q * COMM / 10000,
                interest: Math.round(c0 * q * (cd + sS) * d / 365),
                borrow: -c0 * q * ((t.common_borrow_fee_pct || 0) / 100) * d / 365,
                settled: t.settled_s || 0,
            };
            const L = {
                price: (ppx - p0) * Q,
                cost: -ppx * Q * (COMM + TAX_SELL) / 10000,
                interest: -Math.round(p0 * Q * (cd + sL) * d / 365),
                borrow: 0,
                settled: t.settled_l || 0,
            };
            for (const k in S) S[k] *= fs;
            for (const k in L) L[k] *= fl;
            S.total = S.price + S.cost + S.interest + S.borrow + S.settled;
            L.total = L.price + L.cost + L.interest + L.borrow + L.settled;
            return { S, L, d, cd: cd * 100, c0, p0, start, exposure: t.common_entry * q * fs + t.preferred_entry * Q * fl };
        }
        function holdQty(name) {
            const rows = TRADES.filter(t => t.status === 'Open' && t.pair_name === name);
            return { q: rows.reduce((a, t) => a + t.common_qty, 0), Q: rows.reduce((a, t) => a + t.preferred_qty, 0) };
        }
        function exitQty(name) {
            const H = holdQty(name), qv = document.getElementById('qs').value, Qv = document.getElementById('ql').value;
            return { qs: qv === '' ? H.q : Math.max(0, Math.min(H.q, Math.round(+qv))), ql: Qv === '' ? H.Q : Math.max(0, Math.min(H.Q, Math.round(+Qv))), H };
        }
        function calcPair(name, cpx, ppx, xdate, cd) {
            const rows = TRADES.filter(t => t.status === 'Open' && t.pair_name === name);
            const X = exitQty(name), fs = X.H.q ? X.qs / X.H.q : 0, fl = X.H.Q ? X.ql / X.H.Q : 0;
            const keys = ['price', 'cost', 'interest', 'borrow', 'settled', 'total'];
            const out = { S: {}, L: {}, exposure: 0, parts: [] };
            keys.forEach(k => { out.S[k] = 0; out.L[k] = 0; });
            rows.forEach(t => {
                const r = calcTrade(t, cpx, ppx, xdate, cd, fs, fl); out.parts.push(r); out.exposure += r.exposure;
                keys.forEach(k => { out.S[k] += r.S[k]; out.L[k] += r.L[k]; });
            });
            return out;
        }

        function render() {
            const name = document.getElementById('pair').value;
            const cpx = +document.getElementById('cpx').value, ppx = +document.getElementById('ppx').value;
            const xdate = document.getElementById('xdate').value || kstToday();
            const cdv = document.getElementById('cd').value; const cd = cdv === '' ? null : +cdv;
            if (!name || !cpx || !ppx) return;
            const R = calcPair(name, cpx, ppx, xdate, cd);
            {
                const X = exitQty(name), ca = cpx * X.qs, pa = ppx * X.ql, d = pa - ca;
                const rq = X.H.q - X.qs, rQ = X.H.Q - X.ql, rc = cpx * rq, rp = ppx * rQ, rd = rp - rc;
                const part = (X.qs < X.H.q || X.ql < X.H.Q);
                document.getElementById('qtyBox').innerHTML =
                    `<b class="text-gray-900">청산 금액</b> 보통주 ${X.qs.toLocaleString()}주 × ${cpx.toLocaleString()} = ${Math.round(ca).toLocaleString()}원 · 우선주 ${X.ql.toLocaleString()}주 × ${ppx.toLocaleString()} = ${Math.round(pa).toLocaleString()}원 · `
                    + `<span class="${Math.abs(d) > Math.max(cpx, ppx) ? 'text-red-600 font-semibold' : ''}">차이 ${d >= 0 ? '+' : ''}${Math.round(d).toLocaleString()}원 (${ca ? (d / ca * 100).toFixed(2) : '0.00'}%)</span>`
                    + (part ? `<br><b class="text-gray-900">남는 포지션</b> 보통주 ${rq.toLocaleString()}주 (${Math.round(rc).toLocaleString()}원) · 우선주 ${rQ.toLocaleString()}주 (${Math.round(rp).toLocaleString()}원) · `
                        + `<span class="${Math.abs(rd) > Math.max(cpx, ppx) ? 'text-red-600 font-semibold' : ''}">차이 ${rd >= 0 ? '+' : ''}${Math.round(rd).toLocaleString()}원</span>` : ` <span class="text-gray-400">(전량 청산)</span>`);
                // 진행 관리: 체결률, 남은 포지션 노출, 재개 시 먼저 맞출 수량
                const pb = document.getElementById('progBox');
                if (!part || (X.qs === 0 && X.ql === 0)) { pb.innerHTML = ''; }
                else {
                    const cr = X.qs / X.H.q * 100, pr = X.ql / X.H.Q * 100;
                    // 금액 중립: 남는 두 다리 금액이 같아지도록
                    let neu;
                    if (rd > 0) { const k = Math.min(rQ, Math.round(rd / ppx)); neu = `우선주 <b>${k.toLocaleString()}주</b> 추가 매도`; }
                    else if (rd < 0) { const k = Math.min(rq, Math.round(-rd / cpx)); neu = `보통주 <b>${k.toLocaleString()}주</b> 추가 매수`; }
                    else neu = '이미 균형';
                    // 같은 비율: 원래 보유 비율대로 진행률을 맞춤
                    let rat;
                    const qlT = Math.round(X.H.Q * X.qs / X.H.q), qsT = Math.round(X.H.q * X.ql / X.H.Q);
                    if (X.ql < qlT) rat = `우선주 ${(qlT - X.ql).toLocaleString()}주 추가 매도`;
                    else if (X.qs < qsT) rat = `보통주 ${(qsT - X.qs).toLocaleString()}주 추가 매수`;
                    else rat = '이미 같은 비율';
                    const per = rd > 0 ? Math.round(rc / ppx) : rQ;   // 금액 중립 후 남는 우선주
                    const lc = rd < 0 ? rq - Math.min(rq, Math.round(-rd / cpx)) : rq;
                    const ratio = lc ? Math.round(per / lc * 100) : 0;
                    pb.innerHTML = `<div class="border border-gray-200 rounded-lg p-3 bg-gray-50">`
                        + `<b class="text-gray-900">진행 상황</b> 보통주 ${X.qs.toLocaleString()}/${X.H.q.toLocaleString()}주 (${cr.toFixed(1)}%) · 우선주 ${X.ql.toLocaleString()}/${X.H.Q.toLocaleString()}주 (${pr.toFixed(1)}%)`
                        + `<br><b class="text-gray-900">지금 노출</b> 남은 포지션이 ${rd > 0 ? '우선주(롱) 쪽으로' : rd < 0 ? '보통주(숏) 쪽으로' : ''} ${Math.abs(Math.round(rd)).toLocaleString()}원 기울어 있음`
                        + ` <span class="text-gray-400">(이 금액만큼 한 방향 주가 노출)</span>`
                        + `<br><b class="text-gray-900">재개할 때 먼저</b> ${neu} <span class="text-gray-400">→ 남은 두 다리 금액이 같아짐 (권장)</span>`
                        + `<br><span class="text-gray-500">원래 보유 비율로 맞추려면: ${rat}</span>`
                        + `<br><b class="text-gray-900">그다음</b> 보통주 100주당 우선주 약 ${ratio}주씩 짝지어 진행 (남은 보통주 ${lc.toLocaleString()}주 / 우선주 ${per.toLocaleString()}주)`
                        + `</div>`;
                }
            }
            const line = (label, k, sub) => `<tr class="${sub ? 'sub' : ''}"><td>${label}</td>`
                + [R.S[k], R.L[k], R.S[k] + R.L[k]].map(v => `<td class="num ${cls(v)}">${fmt(v)}</td>`).join('') + '</tr>';
            const P = R.parts[0];
            let h = line(`가격 손익 <span class="text-gray-400">(기준가 ${Math.round(P.c0).toLocaleString()} / ${Math.round(P.p0).toLocaleString()} → 청산가)</span>`, 'price')
                + line('청산 수수료·세금 <span class="text-gray-400">(보통주 10bp, 우선주 30bp)</span>', 'cost')
                + line(`이자 <span class="text-gray-400">(${P.start}~ ${P.d}일, CD ${P.cd.toFixed(2)}%)</span>`, 'interest');
            if (R.S.borrow) h += line('차입수수료', 'borrow');
            if (R.S.settled || R.L.settled) h += line('이미 정산된 현금 <span class="text-gray-400">(롤오버·배당)</span>', 'settled');
            h += line('합계', 'total').replace('<tr class="">', '<tr class="sum">');
            document.getElementById('rows').innerHTML = h;
            const tot = R.S.total + R.L.total, pct = R.exposure ? tot / R.exposure * 100 : 0;
            const te = document.getElementById('total'); te.textContent = fmt(tot); te.className = 'text-3xl font-bold ' + cls(tot);
            const tp = document.getElementById('totalPct'); tp.textContent = `(${pct >= 0 ? '+' : ''}${pct.toFixed(2)}%)`; tp.className = 'text-lg font-semibold ml-1 ' + cls(tot);
            const t0 = TRADES.find(t => t.status === 'Open' && t.pair_name === name);
            document.getElementById('note').innerHTML =
                `투입금액 ${Math.round(R.exposure).toLocaleString()}원 대비. 진입가는 원장의 텀싯 Net Price(진입 수수료·세금 포함). `
                + (t0 && t0.current ? '롤오버된 종목이라 현재 기간 기준가로 평가하고, 지난 기간 정산과 배당은 "이미 정산된 현금"에 들어 있습니다. '
                    : '롤오버 정산 기록이 없어 진입가 기준으로 이자를 계산합니다. ')
                + ((R.S.settled || R.L.settled) ? '' : '배당 기록이 없으면 배당은 빠져 있습니다.');
            // 민감도: 보통주 ±2틱×step, 우선주 ±2틱×step
            const off = [-2, -1, 0, 1, 2];
            const moveTicks = (px, n) => { let v = px; for (let i = 0; i < Math.abs(n); i++) v = n > 0 ? tickUp(v) : tickDown(v); return v; };
            let s = '<thead><tr><th></th>' + off.map(o => `<th>${moveTicks(ppx, o * 2).toLocaleString()}</th>`).join('') + '</tr></thead><tbody>';
            off.forEach(oc => {
                s += `<tr><td class="num" style="text-align:left;font-weight:600">${moveTicks(cpx, oc * 2).toLocaleString()}</td>`;
                off.forEach(op => {
                    const r = calcPair(name, moveTicks(cpx, oc * 2), moveTicks(ppx, op * 2), xdate, cd), v = r.S.total + r.L.total;
                    s += `<td class="num ${cls(v)}" style="${oc === 0 && op === 0 ? 'font-weight:700;background:#f9fafb' : ''}">${fmt(v)}</td>`;
                });
                s += '</tr>';
            });
            document.getElementById('sens').innerHTML = s + '</tbody>';
            const u = new URL(location.href); u.searchParams.set('pair', name); u.searchParams.set('c', cpx); u.searchParams.set('p', ppx);
            history.replaceState(null, '', u);
        }

        function fillPrices(force) {
            const name = document.getElementById('pair').value, lp = LIVEPX[norm(name)];
            const P = new URLSearchParams(location.search);
            const c = document.getElementById('cpx'), p = document.getElementById('ppx');
            if (force || !c.value) c.value = (!force && P.get('pair') === name && P.get('c')) || (lp ? lp.c : '');
            if (force || !p.value) p.value = (!force && P.get('pair') === name && P.get('p')) || (lp ? lp.p : '');
            const t = TRADES.find(x => x.status === 'Open' && x.pair_name === name);
            const cdIn = document.getElementById('cd');
            cdIn.placeholder = t ? String(t.current && t.current.cd != null ? t.current.cd : (t.benchmark_rate_pct || 0)) : '';
            if (force) cdIn.value = '';
            const H = holdQty(name), qsI = document.getElementById('qs'), qlI = document.getElementById('ql');
            if (force || qsI.value === '') qsI.value = H.q; if (force || qlI.value === '') qlI.value = H.Q;
            qsI.max = H.q; qlI.max = H.Q;
            document.getElementById('live').textContent = lp ? `현재가 ${lp.c.toLocaleString()} / ${lp.p.toLocaleString()} (${lp.ts})` : '현재가 없음';
        }

        async function init() {
            TRADES = await (await fetch(`data/pair-trades.json?t=${Date.now()}`)).json();
            try {
                const sd = await (await fetch(`data/stock_data.json?t=${Date.now()}`)).json();
                (sd.all_signals || []).forEach(s => { if (s.price_a && s.price_b) LIVEPX[norm(s.stock_name)] = { c: s.price_a, p: s.price_b, ts: s.timestamp || '' }; });
            } catch (e) { }
            const names = [...new Set(TRADES.filter(t => t.status === 'Open').map(t => t.pair_name))];
            const sel = document.getElementById('pair');
            sel.innerHTML = names.map(n => `<option>${n}</option>`).join('');
            const want = new URLSearchParams(location.search).get('pair');
            if (want && names.includes(want)) sel.value = want;
            document.getElementById('xdate').value = kstToday();
            fillPrices(false); bindTick(document.getElementById('cpx')); bindTick(document.getElementById('ppx')); render();
            sel.addEventListener('change', () => { fillPrices(true); ['cpx', 'ppx'].forEach(id => document.getElementById(id).dispatchEvent(new Event('change'))); render(); });
            ['cpx', 'ppx', 'xdate', 'cd', 'qs', 'ql'].forEach(id => document.getElementById(id).addEventListener('input', render));
            document.getElementById('matchQ').addEventListener('click', () => {   // 보통주 청산 금액에 가장 가까운 우선주 수량
                const name = document.getElementById('pair').value, X = exitQty(name);
                const cpx = +document.getElementById('cpx').value, ppx = +document.getElementById('ppx').value;
                if (!cpx || !ppx) return;
                document.getElementById('ql').value = Math.min(X.H.Q, Math.round(X.qs * cpx / ppx)); render();
            });
            document.getElementById('ratioQ').addEventListener('click', () => {   // 보유 비율 그대로 (남는 포지션 구성 유지)
                const name = document.getElementById('pair').value, X = exitQty(name);
                document.getElementById('ql').value = X.H.q ? Math.round(X.H.Q * X.qs / X.H.q) : 0; render();
            });
            // 현재가로 초기화: 시세를 새로 받아 청산가·청산일(오늘)·CD(원장값)를 되돌림
            document.getElementById('resetPx').addEventListener('click', async () => {
                try {
                    const sd = await (await fetch(`data/stock_data.json?t=${Date.now()}`)).json();
                    (sd.all_signals || []).forEach(s => { if (s.price_a && s.price_b) LIVEPX[norm(s.stock_name)] = { c: s.price_a, p: s.price_b, ts: s.timestamp || '' }; });
                } catch (e) { }
                document.getElementById('xdate').value = kstToday();
                fillPrices(true);
                ['cpx', 'ppx'].forEach(id => document.getElementById(id).dispatchEvent(new Event('change')));
                render();
            });
        }
        init();
    </script>
</body>

</html>
